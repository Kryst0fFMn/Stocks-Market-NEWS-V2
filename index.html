<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Market Pulse – světové trhy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: dark;
      --bg: #14130f;
      --glow: #211b0f;
      --panel: #1d1b16;
      --panel2: #25221b;
      --text: #f1ead9;
      --muted: #8f8774;
      --accent: #e8b04b;
      --green: #6fd3a0;
      --red: #f0776a;
      --border: #2f2b22;
      --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
      --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 40px 20px 60px;
      min-height: 100vh;
      color: var(--text);
      background: radial-gradient(900px 400px at 15% -5%, var(--glow), transparent 70%), var(--bg);
      font-family: var(--sans);
    }

    main { max-width: 1180px; margin: 0 auto; }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
    }

    h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(2.1rem, 5vw, 2.8rem);
      font-weight: 700;
      letter-spacing: -.02em;
      line-height: 1;
    }
    h1 span { color: var(--accent); }

    .muted, .meta { color: var(--muted); }
    header .muted { margin-top: 8px; font-size: .9rem; }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-top: 10px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: .75rem;
    }
    .status::before {
      content: "";
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(111, 211, 160, .15);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 28px 0 26px;
    }

    .search-wrap { position: relative; flex: 1; min-width: 200px; }
    .search-wrap svg {
      position: absolute; left: 16px; top: 50%;
      transform: translateY(-50%);
      width: 18px; height: 18px;
      stroke: var(--muted); fill: none;
      stroke-width: 2; stroke-linecap: round;
      pointer-events: none;
    }

    input, select {
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 13px 18px;
      font: inherit;
      font-size: .95rem;
      outline: none;
      transition: border-color .2s;
    }
    input { width: 100%; padding-left: 44px; }
    select { min-width: 180px; cursor: pointer; }
    input:focus, select:focus { border-color: var(--accent); }
    ::placeholder { color: var(--muted); }

    .tabs {
      display: flex;
      gap: 28px;
      margin-bottom: 22px;
      border-bottom: 1px solid var(--border);
    }
    .tab {
      position: relative;
      padding: 0 2px 12px;
      background: none;
      border: none;
      color: var(--muted);
      font-family: var(--serif);
      font-size: 1.5rem;
      font-weight: 600;
      cursor: pointer;
      transition: color .2s;
    }
    .tab:hover, .tab.active { color: var(--text); }
    .tab.active::after {
      content: "";
      position: absolute; left: 0; right: 0; bottom: -1px;
      height: 3px; border-radius: 3px;
      background: var(--accent);
    }

    .stock-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .card, .section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
    }

    .card {
      position: relative;
      overflow: hidden;
      transition: transform .2s, background .2s, border-color .2s;
    }
    .card::before {
      content: "";
      position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--border);
    }
    .card.up::before { background: var(--green); }
    .card.down::before { background: var(--red); }
    .card:hover {
      transform: translateY(-3px);
      background: var(--panel2);
      border-color: #443e30;
    }

    .stock-top { display: flex; justify-content: space-between; gap: 10px; }

    .company { font-weight: 600; font-size: 1rem; }

    .ticker, .market { color: var(--muted); font-size: .78rem; margin-top: 4px; }
    .ticker { font-family: var(--mono); color: #b9b19c; margin-top: 5px; }

    .pill {
      height: fit-content;
      padding: 3px 7px;
      border-radius: 6px;
      border: 1px solid rgba(232, 176, 75, .35);
      color: var(--accent);
      font-family: var(--mono);
      font-size: .65rem;
      letter-spacing: .04em;
    }

    .price {
      margin: 16px 0 10px;
      font-family: var(--mono);
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: -.02em;
    }

    .change {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 6px;
      font-family: var(--mono);
      font-size: .78rem;
      font-weight: 600;
    }
    .change.up { color: var(--green); background: rgba(111, 211, 160, .12); }
    .change.down { color: var(--red); background: rgba(240, 119, 106, .12); }

    .card { cursor: pointer; }
    .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .modal {
      position: fixed; inset: 0; z-index: 50;
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
      background: rgba(10, 9, 6, .78);
      backdrop-filter: blur(4px);
    }
    .modal-panel {
      position: relative;
      width: 100%; max-width: 860px; max-height: 94vh; overflow-y: auto;
      padding: 24px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
    }
    .modal-panel h3 { margin: 0; font-family: var(--serif); font-size: 1.6rem; }
    .modal-close {
      position: absolute; top: 16px; right: 16px;
      width: 34px; height: 34px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--panel2);
      color: var(--muted);
      font-size: 1rem; cursor: pointer;
    }
    .modal-close:hover { color: var(--text); border-color: var(--accent); }
    .chart-summary { margin: 14px 0 12px; font-family: var(--mono); font-weight: 600; }
    .chart-summary.up { color: var(--green); }
    .chart-summary.down { color: var(--red); }
    .ranges { display: flex; gap: 8px; margin-bottom: 14px; }
    .range {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: none;
      color: var(--muted);
      font-family: var(--mono); font-size: .8rem;
      cursor: pointer;
    }
    .range:hover { color: var(--text); }
    .range.active { color: #14130f; background: var(--accent); border-color: var(--accent); }
    .chart-box { position: relative; }
    .chart { display: block; width: 100%; height: auto; touch-action: none; }
    .ch-grid { stroke: var(--border); stroke-width: 1; }
    .ch-label { fill: var(--muted); font-family: var(--mono); font-size: 11px; }
    .ch-line { fill: none; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
    .ch-cursor { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
    .chart-up .ch-line { stroke: var(--green); }
    .chart-down .ch-line { stroke: var(--red); }
    .chart-up .g-top { stop-color: var(--green); stop-opacity: .28; }
    .chart-down .g-top { stop-color: var(--red); stop-opacity: .28; }
    .chart-up .g-bottom, .chart-down .g-bottom { stop-opacity: 0; }
    .chart-up .ch-dot { fill: var(--green); }
    .chart-down .ch-dot { fill: var(--red); }
    .chart-tip {
      position: absolute; pointer-events: none;
      transform: translate(-50%, -150%);
      padding: 5px 9px;
      border-radius: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      font-family: var(--mono); font-size: .75rem; white-space: nowrap;
    }

    .news-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }

    .news-item {
      padding: 14px;
      border-radius: 12px;
      background: var(--panel2);
      border: 1px solid var(--border);
    }
    .news-item a { color: var(--text); text-decoration: none; font-weight: 500; }
    .news-item a:hover { color: var(--accent); text-decoration: underline; }

    .meta { margin-bottom: 7px; font-size: .8rem; font-family: var(--mono); }

    .impact {
      margin-top: 8px;
      color: var(--accent);
      font-size: .88rem;
      line-height: 1.4;
    }

    .empty { color: var(--muted); padding: 12px 0; grid-column: 1 / -1; }

    .hidden { display: none; }

    .disclaimer {
      margin-top: 40px;
      padding-top: 18px;
      max-width: 760px;
      border-top: 1px dashed var(--border);
      color: var(--muted);
      font-size: .78rem;
      line-height: 1.6;
    }

    @media (max-width: 980px) { .stock-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 700px) {
      .stock-grid { grid-template-columns: repeat(2, 1fr); }
      body { padding: 24px 12px 40px; }
    }
    @media (max-width: 420px) { .stock-grid { grid-template-columns: 1fr; } }
  </style>
</head>

<body>
  <main>
    <header>
      <div>
        <h1>Market <span>Pulse</span></h1>
        <div class="muted">Akcie a zprávy z více světových trhů</div>
      </div>
      <div id="updated" class="status">Načítám data…</div>
    </header>

    <div class="controls">
      <label class="search-wrap">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input
          id="search"
          type="search"
          placeholder="Hledat firmu nebo ticker…"
          aria-label="Hledat firmu nebo ticker"
        >
      </label>

      <select id="marketFilter" aria-label="Filtrovat podle trhu">
        <option value="">Všechny trhy</option>
      </select>
    </div>

    <nav class="tabs">
      <button class="tab active" data-tab="stocksPanel">Akcie</button>
      <button class="tab" data-tab="newsPanel">Zprávy</button>
    </nav>

    <section id="stocksPanel">
      <div id="stocks" class="stock-grid">
        <div class="empty">Načítám kotace…</div>
      </div>
    </section>

    <section id="newsPanel" class="section hidden">
      <ul id="news" class="news-list">
        <li class="empty">Načítám zprávy…</li>
      </ul>
    </section>

    <footer class="disclaimer">
      Upozornění: Tržní data mohou být zpožděná, chybná nebo neúplná.
      Odhad dopadu zprávy je automatický a může být nepřesný.
      Ověřujte informace u původního zdroje. Nejde o investiční doporučení.
    </footer>
  </main>

  <div id="chartModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="chartTitle">
    <div class="modal-panel">
      <button class="modal-close" id="chartClose" aria-label="Zavřít">✕</button>
      <h3 id="chartTitle"></h3>
      <div id="chartSub" class="ticker"></div>
      <div id="chartSummary" class="chart-summary"></div>
      <div class="ranges">
        <button class="range" data-range="1M">1M</button>
        <button class="range" data-range="3M">3M</button>
        <button class="range" data-range="6M">6M</button>
        <button class="range" data-range="1R">1R</button>
      </div>
      <div id="chartBox" class="chart-box"></div>
    </div>
  </div>

  <script>
    let allStocks = [];

    function makeElement(tag, className, text) {
      const element = document.createElement(tag);

      if (className) {
        element.className = className;
      }

      if (text !== undefined) {
        element.textContent = text;
      }

      return element;
    }

    function formatPrice(stock, value = stock.price) {
      const rawPrice = Number(value);

      if (!Number.isFinite(rawPrice)) {
        return "Cena není dostupná";
      }

      // Yahoo Finance uvádí některé britské akcie v pencích.
      // Převedeme pence na libry, aby se cena zobrazila správně.
      const isPence = stock.currency === "GBp";
      const price = isPence ? rawPrice / 100 : rawPrice;
      const currency = isPence ? "GBP" : (stock.currency || "USD");

      try {
        return new Intl.NumberFormat("cs-CZ", {
          style: "currency",
          currency,
          maximumFractionDigits: 2
        }).format(price);
      } catch {
        // Záložní zobrazení, pokud prohlížeč kód měny nepodporuje.
        return `${price.toFixed(2)} ${currency}`;
      }
    }

    function renderStocks() {
      const root = document.getElementById("stocks");
      const query = document.getElementById("search").value.trim().toLowerCase();
      const selectedMarket = document.getElementById("marketFilter").value;

      root.replaceChildren();

      const shownStocks = allStocks.filter(stock => {
        const searchableText =
          `${stock.name || ""} ${stock.symbol || ""} ${stock.market || ""}`
            .toLowerCase();

        return searchableText.includes(query)
          && (!selectedMarket || stock.market === selectedMarket);
      });

      if (shownStocks.length === 0) {
        root.append(makeElement("div", "empty", "Žádné odpovídající kotace."));
        return;
      }

      for (const stock of shownStocks) {
        const change = Number(stock.change);
        const hasChange = Number.isFinite(change);
        const direction = hasChange ? (change >= 0 ? "up" : "down") : "";

        const card = makeElement("article", `card ${direction}`.trim());
        card.tabIndex = 0;
        card.addEventListener("click", () => openChart(stock));
        card.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openChart(stock);
          }
        });
        const top = makeElement("div", "stock-top");
        const identity = document.createElement("div");

        identity.append(
          makeElement("div", "company", stock.name || "Neznámá firma"),
          makeElement("div", "ticker", stock.symbol || ""),
          makeElement("div", "market", stock.market || "")
        );

        top.append(
          identity,
          makeElement("span", "pill", stock.currency || "")
        );

        card.append(
          top,
          makeElement("div", "price", formatPrice(stock))
        );

        if (hasChange) {
          const sign = change > 0 ? "+" : "";
          const arrow = change >= 0 ? "▲" : "▼";

          card.append(
            makeElement(
              "div",
              `change ${direction}`,
              `${arrow} ${sign}${change.toFixed(2)} % za poslední obchodní den`
            )
          );
        } else {
          card.append(
            makeElement("div", "muted", "Změna není dostupná")
          );
        }

        root.append(card);
      }
    }

    function renderNews(items) {
      const root = document.getElementById("news");
      root.replaceChildren();

      if (!Array.isArray(items) || items.length === 0) {
        root.append(
          makeElement("li", "empty", "Momentálně nejsou dostupné žádné zprávy.")
        );
        return;
      }

      for (const item of items) {
        const li = makeElement("li", "news-item");
        const company = item.company || "Firemní zprávy";
        const time = item.time || "Čas neuveden";
        const title = item.title || "Zpráva bez titulku";

        li.append(makeElement("div", "meta", `${company} · ${time}`));

        const link = document.createElement("a");
        link.textContent = title;

        try {
          const url = new URL(item.url);
          if (url.protocol === "https:" || url.protocol === "http:") {
            link.href = url.href;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
          }
        } catch {
          // Pokud odkaz není platná URL, zobrazíme titulek bez klikacího odkazu.
        }

        li.append(link);

        if (item.impact) {
          li.append(makeElement("div", "impact", item.impact));
        }

        root.append(li);
      }
    }

    async function loadData() {
      const status = document.getElementById("updated");

      try {
        const response = await fetch(`data/market.json?t=${Date.now()}`, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("Soubor s daty zatím není dostupný.");
        }

        const data = await response.json();

        allStocks = Array.isArray(data.stocks) ? data.stocks : [];

        const marketFilter = document.getElementById("marketFilter");
        const selectedMarket = marketFilter.value;
        const markets = [...new Set(
          allStocks.map(stock => stock.market).filter(Boolean)
        )].sort();

        marketFilter.replaceChildren(new Option("Všechny trhy", ""));

        for (const market of markets) {
          marketFilter.add(new Option(market, market));
        }

        // Po opětovném načtení dat zachová vybraný trh, pokud stále existuje.
        if (markets.includes(selectedMarket)) {
          marketFilter.value = selectedMarket;
        }

        if (data.updated_at) {
          const updatedDate = new Date(data.updated_at);
          status.textContent = Number.isNaN(updatedDate.getTime())
            ? "Data jsou načtena"
            : `Aktualizováno: ${updatedDate.toLocaleString("cs-CZ")}`;
        } else {
          status.textContent = "Data jsou načtena";
        }

        renderStocks();
        renderNews(data.news);
      } catch (error) {
        status.textContent = "Data se nepodařilo načíst";
        document.getElementById("stocks").replaceChildren(
          makeElement(
            "div",
            "empty",
            `${error.message} Zkus stránku obnovit po úspěšném běhu workflow.`
          )
        );
        renderNews([]);
      }
    }

    // ---- Graf akcie (kliknutí na kartu) ----
    const RANGE_DAYS = { "1M": 30, "3M": 91, "6M": 182, "1R": 366 };
    let chartStock = null;
    let chartRange = "3M";

    function svgEl(tag, attrs = {}) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [key, value] of Object.entries(attrs)) {
        el.setAttribute(key, value);
      }
      return el;
    }

    function openChart(stock) {
      chartStock = stock;
      document.getElementById("chartTitle").textContent = stock.name || stock.symbol || "";
      document.getElementById("chartSub").textContent =
        [stock.symbol, stock.market].filter(Boolean).join(" · ");
      document.getElementById("chartModal").classList.remove("hidden");
      document.body.style.overflow = "hidden";
      drawChart();
    }

    function closeChart() {
      document.getElementById("chartModal").classList.add("hidden");
      document.body.style.overflow = "";
    }

    function drawChart() {
      const box = document.getElementById("chartBox");
      const summary = document.getElementById("chartSummary");
      box.replaceChildren();
      summary.textContent = "";
      summary.className = "chart-summary";

      document.querySelectorAll(".range").forEach(button => {
        button.classList.toggle("active", button.dataset.range === chartRange);
      });

      const history = Array.isArray(chartStock.history) ? chartStock.history : [];
      const cutoff = new Date();
      cutoff.setDate(cutoff.getDate() - RANGE_DAYS[chartRange]);

      const points = history
        .map(([day, value]) => ({ date: new Date(day), value: Number(value) }))
        .filter(point => Number.isFinite(point.value) && point.date >= cutoff);

      if (points.length < 2) {
        box.append(makeElement(
          "div", "empty",
          "Data pro graf zatím nejsou k dispozici. Spusť aktualizaci dat a obnov stránku."
        ));
        return;
      }

      const first = points[0].value;
      const last = points[points.length - 1].value;
      const rangeChange = first ? (last - first) / first * 100 : 0;
      const dir = rangeChange >= 0 ? "up" : "down";

      summary.className = `chart-summary ${dir}`;
      summary.textContent =
        `${formatPrice(chartStock, last)}  ·  ${rangeChange >= 0 ? "+" : ""}${rangeChange.toFixed(2)} % za zvolené období`;

      const W = 800, H = 340, padL = 90, padR = 14, padT = 14, padB = 28;
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;

      const values = points.map(point => point.value);
      let min = Math.min(...values);
      let max = Math.max(...values);
      const margin = (max - min) * 0.08 || max * 0.01 || 1;
      min -= margin;
      max += margin;

      const x = i => padL + (i / (points.length - 1)) * plotW;
      const y = v => padT + (1 - (v - min) / (max - min)) * plotH;

      const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, class: `chart chart-${dir}`, role: "img" });

      const defs = svgEl("defs");
      const gradient = svgEl("linearGradient", { id: "chartFill", x1: "0", y1: "0", x2: "0", y2: "1" });
      gradient.append(
        svgEl("stop", { offset: "0%", class: "g-top" }),
        svgEl("stop", { offset: "100%", class: "g-bottom" })
      );
      defs.append(gradient);
      svg.append(defs);

      for (let i = 0; i <= 4; i++) {
        const value = min + (max - min) * i / 4;
        const py = y(value);
        svg.append(svgEl("line", { x1: padL, x2: W - padR, y1: py, y2: py, class: "ch-grid" }));

        const label = svgEl("text", { x: padL - 8, y: py + 4, "text-anchor": "end", class: "ch-label" });
        label.textContent = formatPrice(chartStock, value);
        svg.append(label);
      }

      [0, Math.floor((points.length - 1) / 2), points.length - 1].forEach((index, k) => {
        const label = svgEl("text", {
          x: x(index),
          y: H - 8,
          "text-anchor": k === 0 ? "start" : (k === 2 ? "end" : "middle"),
          class: "ch-label"
        });
        label.textContent = points[index].date.toLocaleDateString("cs-CZ", {
          day: "numeric", month: "numeric", year: "2-digit"
        });
        svg.append(label);
      });

      const line = points
        .map((point, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(point.value).toFixed(1)}`)
        .join(" ");

      svg.append(
        svgEl("path", {
          d: `${line} L${x(points.length - 1).toFixed(1)} ${padT + plotH} L${padL} ${padT + plotH} Z`,
          fill: "url(#chartFill)"
        }),
        svgEl("path", { d: line, class: "ch-line" })
      );

      const cursor = svgEl("line", { y1: padT, y2: padT + plotH, class: "ch-cursor", visibility: "hidden" });
      const dot = svgEl("circle", { r: 4.5, class: "ch-dot", visibility: "hidden" });
      svg.append(cursor, dot);

      const tip = makeElement("div", "chart-tip hidden");
      box.append(svg, tip);

      const show = event => {
        const rect = svg.getBoundingClientRect();
        const px = (event.clientX - rect.left) / rect.width * W;
        const i = Math.max(0, Math.min(points.length - 1,
          Math.round((px - padL) / plotW * (points.length - 1))));
        const point = points[i];
        const cx = x(i);
        const cy = y(point.value);

        cursor.setAttribute("x1", cx);
        cursor.setAttribute("x2", cx);
        dot.setAttribute("cx", cx);
        dot.setAttribute("cy", cy);
        cursor.removeAttribute("visibility");
        dot.removeAttribute("visibility");

        tip.textContent = `${point.date.toLocaleDateString("cs-CZ")} · ${formatPrice(chartStock, point.value)}`;
        tip.classList.remove("hidden");
        tip.style.left = `${Math.min(Math.max(cx / W * 100, 18), 82)}%`;
        tip.style.top = `${cy / H * 100}%`;
      };

      const hide = () => {
        cursor.setAttribute("visibility", "hidden");
        dot.setAttribute("visibility", "hidden");
        tip.classList.add("hidden");
      };

      svg.addEventListener("pointermove", show);
      svg.addEventListener("pointerdown", show);
      svg.addEventListener("pointerleave", hide);
    }

    document.querySelectorAll(".range").forEach(button => {
      button.addEventListener("click", () => {
        chartRange = button.dataset.range;
        drawChart();
      });
    });
    document.getElementById("chartClose").addEventListener("click", closeChart);
    document.getElementById("chartModal").addEventListener("click", event => {
      if (event.target.id === "chartModal") closeChart();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeChart();
    });

    // Přepínání záložek Akcie / Zprávy
    document.querySelectorAll(".tab").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(tab => {
          tab.classList.toggle("active", tab === button);
        });

        for (const id of ["stocksPanel", "newsPanel"]) {
          document.getElementById(id).classList.toggle("hidden", id !== button.dataset.tab);
        }
      });
    });

    document.getElementById("search").addEventListener("input", renderStocks);
    document.getElementById("marketFilter").addEventListener("change", renderStocks);

    loadData();

    // Stránka znovu načte JSON každých 5 minut.
    // Samotný JSON se aktualizuje podle rozvrhu GitHub Actions.
    setInterval(loadData, 5 * 60 * 1000);
  </script>
</body>
</html>

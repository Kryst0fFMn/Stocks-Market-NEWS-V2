name: Aktualizace tržních dat

on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Poslat testovací oznámení do telefonu"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-market
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Načti repozitář
        uses: actions/checkout@v4

      - name: Nastav Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Nainstaluj yfinance
        run: python -m pip install yfinance

      - name: Stáhni kotace a zprávy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TEST: ${{ inputs.test_notification }}
        run: python scripts/update_market.py

      - name: Ulož aktualizovaný JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          git diff --cached --quiet || git commit -m "Aktualizovat tržní data"
          git pull --rebase
          git push
